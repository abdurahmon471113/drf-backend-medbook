[project]
name = "medbook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6.0",
    "django-environ>=0.14.0",
    "django-filter>=26.2",
    "django-money>=3.6.2",
    "django-phonenumber-field[phonenumbers]>=9.0.0",
    "django-simple-history>=3.13.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pre-commit>=4.7.0",
]



[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88